# 로컬 개발용 MySQL 8. `docker compose up -d` 후 apps/api에서 alembic upgrade head && python -m seed.seed_demo
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golf
      MYSQL_USER: golf
      MYSQL_PASSWORD: golf
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./apps/api/seed/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  dbdata:

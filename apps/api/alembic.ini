# Table migrations (Alembic). Run: alembic upgrade head  (in apps/api)
# Keep this file ASCII only: alembic reads it with the OS locale encoding (cp949 on Korean Windows)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(message)s
